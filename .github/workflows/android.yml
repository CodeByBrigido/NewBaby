name: Android

# Duas coisas diferentes acontecem aqui:
#
# 1. `compilar` roda em todo pull request e prova que o projeto Android
#    compila, usando o google-services.json de exemplo que está versionado.
#    Não precisa de segredo nenhum - e é a única verificação que existe do
#    lado Gradle, já que `flutter analyze` e `flutter test` rodam na Dart VM
#    e não encostam no build nativo.
#
# 2. `apk` só roda quando pedido (ou em uma tag) e usa a configuração real
#    do Firebase, guardada nos segredos do repositório, para gerar o APK
#    que dá para instalar no celular.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  compilar:
    name: Compila o app Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Usar a configuração de exemplo
        # Só para o plugin do Google Services encontrar um arquivo válido.
        # O APK que sai daqui NÃO serve para instalar: com estas chaves ele
        # abre e falha no Firebase.initializeApp. Serve para provar que o
        # projeto compila e sobrevive à ofuscação.
        run: cp android/app/google-services.json.example android/app/google-services.json

      - name: Baixar dependências
        run: flutter pub get

      - name: Build de release
        # Release, não debug, de propósito: é o build que passa pelo R8
        # (minify + shrink). Os modelos do googleapis são montados por
        # reflexão, então uma regra de ProGuard faltando só aparece aqui -
        # nunca em debug, nunca no analyze, nunca nos testes.
        run: flutter build apk --release

      - name: Conferir que o APK saiu
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          echo "APK gerado: $(du -h "$apk" | cut -f1)"
          unzip -l "$apk" | grep -q AndroidManifest.xml
          echo "Estrutura do APK conferida."

      - name: Conferir as permissões do APK
        # O manifesto que vai para a loja não é o que está no repositório: a
        # fusão acrescenta o que cada plugin declara. O open_filex pede a
        # galeria inteira (imagens, vídeos e áudio) e o video_compress pede
        # escrita no armazenamento - nada disso é usado aqui, e o
        # `tools:node="remove"` do nosso manifesto tira os cinco.
        #
        # Isso é invisível no código: um plugin novo, ou uma atualização que
        # renomeie uma permissão, volta a incluí-la sem nenhum sinal. Então a
        # lista é lida do APK montado e conferida de duas formas.
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk

          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          test -n "$aapt2"

          "$aapt2" dump permissions "$apk" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" \
            | sort -u > permissoes.txt

          echo "Permissões declaradas no APK:"
          sed 's/^/  /' permissoes.txt

          # 1. Barreira dura. Nenhuma destas pode aparecer, nunca. São as de
          #    nível "dangerous" - as que abrem uma caixa de diálogo e dão
          #    acesso ao acervo pessoal de quem instalou. Um aplicativo que
          #    promete privacidade não pede acesso à galeria inteira, e a
          #    política de Photo and Video Permissions do Google Play recusa
          #    quem faz isso podendo usar o seletor do sistema.
          proibidas='READ_MEDIA_IMAGES|READ_MEDIA_VIDEO|READ_MEDIA_AUDIO'
          proibidas="$proibidas|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE"
          proibidas="$proibidas|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_VISUAL_USER_SELECTED"
          proibidas="$proibidas|CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION"
          proibidas="$proibidas|ACCESS_COARSE_LOCATION|READ_CONTACTS|GET_ACCOUNTS"
          proibidas="$proibidas|READ_PHONE_STATE|QUERY_ALL_PACKAGES"

          if grep -qE "\.($proibidas)$" permissoes.txt; then
            echo "::error::O APK pede acesso a dados pessoais do aparelho."
            grep -E "\.($proibidas)$" permissoes.txt | sed 's/^/  → /'
            echo "As fotos entram pelo seletor do sistema e os documentos pelo"
            echo "SAF; nenhum dos dois precisa de permissão. Se um plugin novo"
            echo "trouxe isso, remova com tools:node=\"remove\" em"
            echo "android/app/src/main/AndroidManifest.xml."
            exit 1
          fi

          # 2. Rede de segurança. A lista completa também é fixada, para que
          #    qualquer permissão nova - mesmo inofensiva - apareça na revisão
          #    em vez de entrar de carona numa atualização de dependência.
          #
          #    Além da INTERNET, que é nossa, todas vêm da pilha do Firebase,
          #    do Google Play Services e do Credential Manager (que o
          #    google_sign_in 7 usa para o login). São de nível normal ou de
          #    assinatura: não abrem caixa de diálogo nenhuma.
          cat > esperado.txt <<'PERMISSOES'
          android.permission.ACCESS_NETWORK_STATE
          android.permission.INTERNET
          android.permission.USE_BIOMETRIC
          android.permission.USE_FINGERPRINT
          android.permission.WAKE_LOCK
          br.com.brigido.meu_bebe.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
          com.google.android.providers.gsf.permission.READ_GSERVICES
          PERMISSOES
          sed -i 's/^ *//' esperado.txt

          if ! diff -u esperado.txt permissoes.txt; then
            echo "::error::A lista de permissões do APK mudou."
            echo "Nenhuma delas é perigosa (a checagem acima já passou), mas"
            echo "a mudança precisa ser consciente: confira de onde veio e"
            echo "atualize a lista neste arquivo se for aceitável."
            exit 1
          fi

          echo "Nenhuma permissão de acesso a dados pessoais. Lista inalterada."

  apk:
    name: Gerar APK para instalar
    # Só quando pedido de propósito: este é o job que usa a conta real.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Conferir os segredos antes de tentar
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          set -euo pipefail
          faltando=0
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::Falta o segredo GOOGLE_SERVICES_JSON."
            faltando=1
          fi
          if [ -z "${FIREBASE_OPTIONS_DART}" ]; then
            echo "::error::Falta o segredo FIREBASE_OPTIONS_DART."
            faltando=1
          fi
          if [ "$faltando" = "1" ]; then
            echo "Veja o passo a passo em INSTALAR.md, seção 'Passo 1'."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Restaurar a configuração real do Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
          # Falha cedo e com mensagem clara se o base64 veio truncado.
          python3 -c "import json;json.load(open('android/app/google-services.json'))"
          grep -q 'class DefaultFirebaseOptions' lib/firebase_options.dart
          if grep -q 'SEU_WEB_CLIENT_ID' lib/firebase_options.dart; then
            echo "::error::O firebase_options.dart enviado ainda tem o placeholder do serverClientId."
            echo "Sem o Client ID Web o login falha no Android. Veja o SETUP.md, passo 6.3."
            exit 1
          fi

      - name: Baixar dependências
        run: flutter pub get

      - name: Build de release
        # Um APK por arquitetura: cada um fica bem menor que o universal.
        run: flutter build apk --release --split-per-abi

      - name: Listar o que foi gerado
        run: |
          set -euo pipefail
          ls -lh build/app/outputs/flutter-apk/*.apk
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            unzip -l "$apk" | grep -q AndroidManifest.xml
          done
          echo "Todos os APKs têm estrutura válida."

      - name: Publicar os APKs
        uses: actions/upload-artifact@v4
        with:
          name: meu-bebe-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Anexar ao Release quando for uma tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*-release.apk
          generate_release_notes: true
