<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Bebê: Cápsula do Tempo</title>
<meta name="description" content="Documentos públicos do Meu Bebê: Cápsula do Tempo.">
<style>
:root {
  color-scheme: light;
  --primary: #D2654E;
  --primary-dark: #B8513E;
  --bg: #FCF3EE;
  --surface: #FFFFFF;
  --text: #2F251F;
  --text-soft: #71665E;
  --border: #E9DDD6;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0 20px 64px;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 44rem; margin: 0 auto; }
header {
  padding: 48px 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.produto {
  font-size: 15px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--primary-dark);
  margin: 0 0 8px;
}
h1 { font-size: 30px; line-height: 1.25; margin: 0 0 8px; }
.data { color: var(--text-soft); font-size: 15px; margin: 0 0 32px; }
h2 {
  font-size: 21px;
  line-height: 1.3;
  margin: 40px 0 12px;
  padding-top: 8px;
}
p { margin: 0 0 16px; }
ul { margin: 0 0 16px; padding-left: 22px; }
li { margin: 0 0 8px; }
a { color: var(--primary-dark); }
strong { font-weight: 650; }
code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em;
  /* "anywhere", e não "break-all": o navegador leva a URL inteira para a
     linha de baixo antes de parti-la, em vez de deixar um "h" órfão no fim
     da linha anterior. */
  overflow-wrap: anywhere;
}
.destaque {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 22px 4px;
  margin: 0 0 8px;
}
.destaque h2 { margin-top: 0; padding-top: 0; }
nav { margin: 40px 0 0; font-size: 16px; }
footer {
  margin-top: 56px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  color: var(--text-soft);
  font-size: 15px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #1B1512;
    --surface: #241D19;
    --text: #F2EAE4;
    --text-soft: #B9ABA2;
    --border: #3A2F29;
    --primary-dark: #F0A48D;
  }
}
</style>
</head>
<body>
<main>
  <header>
    <p class="produto">Meu Bebê: Cápsula do Tempo</p>
    <h1>Documentos públicos</h1>
  </header>
  <p>Um diário digital da infância do seu filho, guardado no Google Drive da
    própria criança.</p>
  <ul>
    <li><a href="termos.html">Termos de Uso</a></li>
    <li><a href="privacidade.html">Política de privacidade</a></li>
    <li><a href="exclusao.html">Exclusão de conta e de dados</a></li>
  </ul>
  <footer>
    <p>Rodrigo Andrade Brigido &middot;
      <a href="mailto:mybabytimecapsule@gmail.com">mybabytimecapsule@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
