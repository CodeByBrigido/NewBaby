name: meu_bebe
description: "Meu Bebê - a cápsula digital da vida da sua filha."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado e navegação
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0

  # Firebase (metadados / índice da linha do tempo)
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1

  # Login Google + acesso ao Drive (arquivos)
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  http: ^1.5.0

  # Seleção e otimização de mídia
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  flutter_image_compress: ^2.5.1
  image_size_getter: ^2.4.1
  video_compress: ^3.1.4
  video_player: ^2.11.0

  # Apresentação
  fl_chart: ^1.2.0

  # Utilidades
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  # 12.x é a série que compartilha a mesma faixa de win32 do file_picker 11.
  share_plus: ^12.0.2
  open_filex: ^4.7.0
  uuid: ^4.6.0
  collection: ^1.19.1
  meta: ^1.16.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
