name: meu_bebe
description: "Meu Bebê: Cápsula do Tempo - a cápsula digital da vida de uma criança."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado e navegação
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0

  # Firebase (metadados / índice da linha do tempo)
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1

  # Login Google + acesso ao Drive (arquivos)
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  http: ^1.5.0

  # Seleção e otimização de mídia
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  flutter_image_compress: ^2.5.1
  image_size_getter: ^2.4.1
  video_compress: ^3.1.4
  video_player: ^2.11.0

  # Apresentação
  fl_chart: ^1.2.0

  # Utilidades
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  # 12.x é a série que compartilha a mesma faixa de win32 do file_picker 11.
  share_plus: ^12.0.2
  open_filex: ^4.7.0
  uuid: ^4.6.0
  collection: ^1.19.1
  meta: ^1.16.0
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Adianta o relógio nos testes de prazo, em vez de esperar de verdade.
  fake_async: ^1.3.3
  # Só para os testes: o `google_sign_in` não deixa criar uma instância dublê
  # (construtor privado), mas a camada de plataforma abaixo dele, sim. É o que
  # permite simular um aparelho onde o login trava.
  google_sign_in_platform_interface: ^3.1.0
  # Gera os ícones do lançador a partir de um arquivo só. Fica em
  # dev_dependencies porque roda na máquina de quem desenvolve e não entra
  # no aplicativo.
  flutter_launcher_icons: ^0.14.4

# O ícone do aplicativo vem de um arquivo único, e de nenhum outro lugar.
#
# Depois de trocar `assets/images/icon/icon.png` pela arte definitiva, rode:
#
#     dart run flutter_launcher_icons
#
# Ele reescreve todos os `mipmap-*` do Android e o `AppIcon.appiconset` do
# iOS. É por isso que os PNGs em `android/.../res` não devem ser editados à
# mão: eles são saída, e não fonte.
flutter_launcher_icons:
  image_path: assets/images/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # O ícone adaptativo do Android recorta as bordas na forma que cada
  # fabricante escolhe. A cor de fundo é a do próprio ladrilho da arte, que
  # é também a da tela de abertura: o ícone e a primeira tela são
  # visivelmente a mesma coisa.
  #
  # A arte já vem com os cantos transparentes, então ela serve de camada da
  # frente sem tratamento nenhum. Enquanto tinha canto branco opaco, era
  # preciso derivar uma segunda cópia; hoje não é mais.
  adaptive_icon_background: '#D2664F'
  adaptive_icon_foreground: assets/images/icon/icon.png

flutter:
  uses-material-design: true
  assets:
    # O conteúdo das inspirações viaja dentro do aplicativo: funciona sem
    # rede, sem custo de servidor, e não manda a idade da criança para
    # lugar nenhum.
    # A pasta inteira, e não arquivo por arquivo: assim acrescentar o ícone
    # e a imagem de fundo do login é só soltar os arquivos aqui, sem mexer
    # em configuração, e a falta deles não quebra a compilação.
    - assets/
    # `- assets/` não alcança subpastas, então as imagens precisam das
    # linhas próprias. Declarar a pasta, e não cada arquivo, é o que permite
    # trocar a arte sem mexer aqui.
    - assets/images/onboarding/
    - assets/images/icon/icon.png
    # As capas das postagens, uma por id. Ver assets/inspiracoes/LEIA-ME.md:
    # a pasta é plana justamente para esta linha nunca mais mudar.
    - assets/inspiracoes/

  # Só os quatro pesos que a escala tipográfica usa. A pasta traz catorze
  # arquivos, incluindo itálicos e pesos extremos que o Design System proíbe:
  # declarar todos colocaria 1,4 MB no aplicativo para nunca serem desenhados.
  #
  # A linha `- assets/` acima não alcança subpastas, então nada de
  # `assets/fonts` entra no pacote sem estar listado aqui.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
